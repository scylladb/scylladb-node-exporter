name: CI

on:
  push:
    branches: [master, 'branch-*']
  pull_request:
    branches: [master, 'branch-*']

jobs:
  build:
    # Explicit name so the check is "build (<arch>)", matching the repository
    # ruleset's required status checks (the runner is a second matrix axis and
    # would otherwise be appended to the default job name).
    name: build (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # Same check as release.yaml, so a bad VERSION fails on the PR, not at release.
      - name: Check VERSION format
        run: |
          if ! [[ "$(cat VERSION)" =~ ^[^-]+-[0-9][0-9A-Za-z.]*$ ]]; then
            echo "VERSION '$(cat VERSION)' must look like <upstream>-<release>, e.g. 1.12.1-3" >&2
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: .go-version

      - name: Build node_exporter from source
        run: make build

      - name: Extract and strip binary
        run: make strip

      - name: Verify binary
        run: |
          file build/node_exporter.stripped
          build/node_exporter.stripped --version

      - name: Scan binary for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: rootfs
          scan-ref: build/node_exporter.stripped
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.arch }}
          path: |
            build/node_exporter.stripped
            build/node_exporter.debug
            build/LICENSE
            build/NOTICE

  package-rpm:
    needs: build
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Download binary artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binary-x86_64
          path: build/

      - name: Install build dependencies
        run: dnf install -y rpm-build systemd-rpm-macros

      - name: Build RPM
        run: |
          VERSION=$(sed 's/-.*//' VERSION)
          RELEASE=$(sed 's/^[^-]*-//' VERSION)
          rpmbuild -bb dist/redhat/scylla-node-exporter.spec \
            --define "version ${VERSION}" \
            --define "release ${RELEASE}" \
            --define "srcdir $(pwd)" \
            --buildroot "$(pwd)/buildroot"

      - name: Verify shadow package exists
        run: |
          rpm -qp --provides $(find ~/rpmbuild/RPMS -name 'scylla-enterprise-node-exporter-*.rpm') | grep scylla-enterprise-node-exporter
          rpm -qp --requires $(find ~/rpmbuild/RPMS -name 'scylla-enterprise-node-exporter-*.rpm') | grep scylla-node-exporter

  package-deb:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Download binary artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binary-x86_64
          path: build/

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev fakeroot debhelper build-essential

      - name: Build DEB
        run: |
          VERSION=$(sed 's/-.*//' VERSION)
          RELEASE=$(sed 's/^[^-]*-//' VERSION)
          cp -a dist/debian/debian debian
          # Keep the epoch (1:) and use the real packaging revision from VERSION.
          sed -i "1s/([^)]*)/(1:$VERSION-$RELEASE)/" debian/changelog
          dpkg-buildpackage -us -uc -b

      - name: Verify shadow package exists
        run: |
          dpkg-deb -I ../scylla-enterprise-node-exporter_*.deb
          dpkg-deb -f ../scylla-enterprise-node-exporter_*.deb Depends | grep scylla-node-exporter
