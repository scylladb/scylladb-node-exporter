name: Release

on:
  push:
    tags:
      - 'v*'
      - 'scylla-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.10.2-1)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set version
        id: version
        run: |
          VERSION=$(sed 's/-.*//' VERSION)
          RELEASE=$(sed 's/^[^-]*-//' VERSION)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "release=${RELEASE}" >> "$GITHUB_OUTPUT"

      - name: Download and build binary
        run: make strip

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary
          path: |
            build/node_exporter.stripped
            build/node_exporter.debug
            build/LICENSE
            build/NOTICE

  package-rpm:
    needs: build
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v5

      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: binary
          path: build/

      - name: Install RPM build tools
        run: dnf install -y rpm-build systemd-rpm-macros

      - name: Build RPM
        run: |
          VERSION=$(sed 's/-.*//' VERSION)
          RELEASE=$(sed 's/^[^-]*-//' VERSION)
          mkdir -p buildroot
          rpmbuild -bb dist/redhat/scylla-node-exporter.spec \
            --define "version ${VERSION}" \
            --define "release ${RELEASE}" \
            --define "srcdir $(pwd)" \
            --buildroot "$(pwd)/buildroot"

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-package
          path: /root/rpmbuild/RPMS/**/*.rpm

  package-deb:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: binary
          path: build/

      - name: Install DEB build tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev fakeroot debhelper build-essential

      - name: Build DEB
        run: |
          cp -a dist/debian/debian debian
          VERSION=$(sed 's/-.*//' VERSION)
          sed -i "1s/([^)]*)/($VERSION-1)/" debian/changelog
          dpkg-buildpackage -us -uc -b

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: ../*.deb

  package-relocatable:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: binary
          path: build/

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y python3

      - name: Build relocatable tarball
        run: python3 scripts/create-relocatable-package.py

      - name: Upload relocatable artifact
        uses: actions/upload-artifact@v4
        with:
          name: relocatable-package
          path: build/scylla-node-exporter-*.tar.gz

  upload-to-s3:
    needs: [package-rpm, package-deb, package-relocatable]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Upload RPM to S3
        run: |
          aws s3 cp artifacts/rpm-package/ \
            s3://downloads.scylladb.com/downloads/scylla/node-exporter/rpm/ \
            --recursive --exclude '*' --include '*.rpm'

      - name: Upload DEB to S3
        run: |
          aws s3 cp artifacts/deb-package/ \
            s3://downloads.scylladb.com/downloads/scylla/node-exporter/deb/ \
            --recursive --exclude '*' --include '*.deb'

      - name: Upload relocatable to S3
        run: |
          aws s3 cp artifacts/relocatable-package/ \
            s3://downloads.scylladb.com/downloads/scylla/node-exporter/relocatable/ \
            --recursive --exclude '*' --include '*.tar.gz'

  create-release:
    needs: [upload-to-s3]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/rpm-package/*.rpm
            artifacts/deb-package/*.deb
            artifacts/relocatable-package/*.tar.gz
