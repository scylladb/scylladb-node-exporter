name: Release

on:
  push:
    tags:
      - 'v*'
      - 'scylla-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.10.2-1)'
        required: true
      branch:
        description: 'Branch to build from (default: master)'
        required: false
        default: 'master'
      docker_only:
        description: 'Only build/push the container image and run Red Hat certification (skip RPM/DEB/relocatable packaging and S3/GitHub release)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Set version
        id: version
        run: |
          VERSION=$(sed 's/-.*//' VERSION)
          RELEASE=$(sed 's/^[^-]*-//' VERSION)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "release=${RELEASE}" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: .go-version

      - name: Build binary from source
        run: make strip

      - name: Scan binary for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: rootfs
          scan-ref: build/node_exporter.stripped
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.arch }}
          path: |
            build/node_exporter
            build/node_exporter.stripped
            build/node_exporter.debug
            build/LICENSE
            build/NOTICE

  package-rpm:
    needs: build
    if: github.event_name != 'workflow_dispatch' || !inputs.docker_only
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            container: fedora:latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
            container: fedora:latest
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Download binary artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binary-${{ matrix.arch }}
          path: build/

      - name: Install RPM build tools
        run: dnf install -y rpm-build systemd-rpm-macros

      - name: Build RPM
        run: |
          VERSION=$(sed 's/-.*//' VERSION)
          RELEASE=$(sed 's/^[^-]*-//' VERSION)
          mkdir -p buildroot
          rpmbuild -bb dist/redhat/scylla-node-exporter.spec \
            --define "version ${VERSION}" \
            --define "release ${RELEASE}" \
            --define "srcdir $(pwd)" \
            --buildroot "$(pwd)/buildroot"
          mkdir -p rpmbuild-out
          find $HOME/rpmbuild/RPMS -name '*.rpm' -exec cp {} rpmbuild-out/ \;

      - name: Upload RPM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rpm-package-${{ matrix.arch }}
          path: rpmbuild-out/*.rpm

  package-deb:
    needs: build
    if: github.event_name != 'workflow_dispatch' || !inputs.docker_only
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Download binary artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binary-${{ matrix.arch }}
          path: build/

      - name: Install DEB build tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev fakeroot debhelper build-essential

      - name: Build DEB
        run: |
          cp -a dist/debian/debian debian
          VERSION=$(sed 's/-.*//' VERSION)
          RELEASE=$(sed 's/^[^-]*-//' VERSION)
          # Keep the epoch (1:) and use the real packaging revision from VERSION.
          sed -i "1s/([^)]*)/(1:$VERSION-$RELEASE)/" debian/changelog
          dpkg-buildpackage -us -uc -b
          mkdir -p deb-out
          cp ../*.deb deb-out/

      - name: Upload DEB artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deb-package-${{ matrix.arch }}
          path: deb-out/*.deb

  package-relocatable:
    needs: build
    if: github.event_name != 'workflow_dispatch' || !inputs.docker_only
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Download binary artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binary-${{ matrix.arch }}
          path: build/

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y python3

      - name: Build relocatable tarball
        run: python3 scripts/create-relocatable-package.py --arch ${{ matrix.arch }}

      - name: Upload relocatable artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: relocatable-package-${{ matrix.arch }}
          path: build/scylla-node-exporter-*.tar.gz

  docker-build-push:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Download x86_64 binary artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binary-x86_64
          path: dist/amd64

      - name: Download aarch64 binary artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binary-aarch64
          path: dist/arm64

      - name: Lay out per-arch build context
        run: |
          for arch_dir in dist/amd64 dist/arm64; do
            mv "$arch_dir/node_exporter.stripped" "$arch_dir/node_exporter"
            chmod +x "$arch_dir/node_exporter"
          done

      - name: Set image tags
        id: tags
        run: |
          VERSION=$(cat VERSION)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to Docker Hub
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.tags.outputs.version }}
          tags: |
            scylladb/scylladb-node-exporter:${{ steps.tags.outputs.version }}
            scylladb/scylladb-node-exporter:latest

  redhat-certify:
    needs: docker-build-push
    runs-on: ubuntu-latest
    steps:
      - name: Run Red Hat preflight container certification
        env:
          PFLT_PYXIS_API_TOKEN: ${{ secrets.PFLT_PYXIS_API_TOKEN }}
          PFLT_CERTIFICATION_PROJECT_ID: ${{ secrets.REDHAT_COMPONENT_ID }}
        run: |
          curl -sSL -o /usr/local/bin/preflight \
            https://github.com/redhat-openshift-ecosystem/openshift-preflight/releases/latest/download/preflight-linux-amd64
          chmod +x /usr/local/bin/preflight
          preflight check container docker.io/scylladb/scylladb-node-exporter:latest \
            --certification-component-id "${PFLT_CERTIFICATION_PROJECT_ID}" \
            --submit=true

      - name: Notify maintainers on certification failure
        if: failure()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Red Hat preflight certification failed for docker.io/scylladb/scylladb-node-exporter:latest`,
              body: `The Red Hat preflight container certification check failed for ` +
                `\`docker.io/scylladb/scylladb-node-exporter:latest\` in ` +
                `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}.\n\n` +
                `Please review the workflow logs and resubmit certification once fixed.`,
              labels: ['certification-failure'],
            })

  upload-to-s3:
    needs: [package-rpm, package-deb, package-relocatable]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          aws-access-key-id: ${{ secrets.S3_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.S3_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Upload RPM to S3
        run: |
          for dir in artifacts/rpm-package-*/; do
            aws s3 cp "$dir" \
              s3://downloads.scylladb.com/downloads/scylla/node-exporter/rpm/ \
              --recursive --exclude '*' --include '*.rpm'
          done

      - name: Upload DEB to S3
        run: |
          for dir in artifacts/deb-package-*/; do
            aws s3 cp "$dir" \
              s3://downloads.scylladb.com/downloads/scylla/node-exporter/deb/ \
              --recursive --exclude '*' --include '*.deb'
          done

      - name: Upload relocatable to S3
        run: |
          for dir in artifacts/relocatable-package-*/; do
            aws s3 cp "$dir" \
              s3://downloads.scylladb.com/downloads/scylla/node-exporter/relocatable/ \
              --recursive --exclude '*' --include '*.tar.gz'
          done

  create-release:
    needs: [upload-to-s3]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Create and push tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          TAG="${{ github.event.inputs.tag }}"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: true
          generate_release_notes: true
          files: |
            artifacts/rpm-package-*/*.rpm
            artifacts/deb-package-*/*.deb
            artifacts/relocatable-package-*/*.tar.gz
